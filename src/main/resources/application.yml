server:
  port: 9110
  tomcat:
    maxConnections: 200

spring:
  profiles:
    # 环境变量 PROFILE 优先；未设置时用 Maven 打包时注入的 @profileActive@（对应 -P local/dev/fat/pro），默认 local
    active: ${PROFILE:@profileActive@}
  servlet:
    multipart:
      # 按需调整；maxRequestSize 应不小于 maxFileSize，且不建议设置过大（当前无上传功能，给出合理默认）
      maxFileSize: 10MB
      maxRequestSize: 20MB
  freemarker:
    allow-request-override: false
    cache: false
    check-template-location: true
    expose-request-attributes: false
    expose-session-attributes: false
    expose-spring-macro-helpers: false
    # 模板文件使用 .html 后缀
    suffix: .html
    charset: UTF-8
    content-type: text/html
    # 页面模板根目录
    template-loader-path: classpath:/templates/
    # 处理页面空值，自动转为""
    settings:
      classic_compatible: true
  web:
    resources:
      static-locations: classpath:/static/

# =====================================================================
# 应用级配置
# =====================================================================
app:
  id: keystone
  # JWT 签名密钥：服务器端机密（签发/校验登录 token）。任意环境都必须配置：
  #   测试/生产必须用环境变量 JWT_SECRET 注入强随机值；本地开发见 application-local.yml。
  #   未配置时应用启动直接失败（fail-fast），确保不存在公开默认密钥。
  jwt:
    secret: ${JWT_SECRET:}
    # 登录 token 会写入 HttpOnly Cookie（解决 iframe 弹层等页面跳转无法携带请求头的问题），
    # 浏览器端不再把 token 存 localStorage；同时下发非 HttpOnly 的 CSRF Cookie 供写请求双提交校验。
    # 是否给 Cookie 加 Secure 标志（仅 HTTPS 生效）：生产设 true（环境变量 COOKIE_SECURE），
    # 本地/内网 http 调试保持 false，否则浏览器不会发送 Secure Cookie 导致页面权限失效
    cookie-secure: ${COOKIE_SECURE:false}

# =====================================================================
# Keystone 安全配置
# =====================================================================
keystone:
  security:
    # 内置管理员名单：名单内用户始终拥有全部页面访问权限（可覆盖）。
    # 单机演示默认账号 admin/123456 来自下方 users 配置。
    admin-users:
      - admin
    # 可登录账号列表：username=password，多个用英文逗号分隔。
    # 生产请改为查询用户表/AD/LDAP（见 AuthService 注释的扩展点）。
    users: ${KEYSTONE_USERS:admin=123456}
    # 菜单页面权限严格模式：默认 false。
    #   true  : 标注了 @MenuPermission 的页面/接口，非内置管理员 → 页面进无权限页、/api 数据接口返回 4010。
    #   false : 任何已登录用户均可访问（注解仅用于前端菜单渲染与未来扩展）。
    menu-auth-strict: ${KEYSTONE_MENU_STRICT:false}

  # 跨域白名单（CORS）：仅列出的来源允许携带凭据跨域访问，禁止 "*" + credentials 组合
  cors:
    allowed-origins: ${KEYSTONE_CORS_ORIGINS:http://localhost:9110,http://127.0.0.1:9110}