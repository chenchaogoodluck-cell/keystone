<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Keystone · 主页</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/layui/css/layui.css?v=2.13.6" media="all">
    <link rel="stylesheet" href="/style/admin.css?v=2.13.6" media="all">
    <style>
        .shortcut-group { margin-bottom: 16px; }
        .shortcut-group-title {
            font-size: 13px; color: #999; margin-bottom: 10px;
            padding-left: 4px; border-left: 3px solid #1E9FFF; line-height: 1;
        }
        .layadmin-shortcut li { text-align: center; }
        .layadmin-shortcut li a {
            display: block; padding: 20px 10px; border-radius: 6px;
            transition: all 0.2s; background: #f8f9fa;
        }
        .layadmin-shortcut li a:hover {
            background: #e6f3ff; transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30,159,255,0.15);
        }
        .layadmin-shortcut li i { font-size: 28px; display: block; margin-bottom: 8px; }
        .layadmin-shortcut li cite { font-style: normal; color: #333; font-size: 13px; }
    </style>
</head>
<body>

<div class="layui-fluid">
    <div class="layui-card">
        <div class="layui-card-body" style="padding: 15px 15px 0 15px;">
            <div class="layui-tab layui-tab-brief" lay-filter="homeTab">
                <ul class="layui-tab-title"><li class="layui-this">快捷方式</li></ul>
                <div class="layui-tab-content" style="padding: 15px 0;">
                    <div class="layui-tab-item layui-show">
                        <div class="shortcut-group">
                            <div class="shortcut-group-title">示例模块</div>
                            <ul class="layui-row layui-col-space10 layadmin-shortcut">
                                <li class="layui-col-xs6 layui-col-sm3 layui-col-md2" data-permission="demo:list">
                                    <a lay-href="/demo/list">
                                        <i class="layui-icon layui-icon-template" style="color: #1E9FFF;"></i>
                                        <cite>数据列表</cite>
                                    </a>
                                </li>
                                <li class="layui-col-xs6 layui-col-sm3 layui-col-md2" data-permission="demo:datasource">
                                    <a lay-href="/demo/datasource">
                                        <i class="layui-icon layui-icon-cellphone" style="color: #FFB800;"></i>
                                        <cite>多数据源演示</cite>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <div class="shortcut-group">
                            <div class="shortcut-group-title">系统</div>
                            <ul class="layui-row layui-col-space10 layadmin-shortcut">
                                <li class="layui-col-xs6 layui-col-sm3 layui-col-md2">
                                    <a lay-href="/druid/index.html">
                                        <i class="layui-icon layui-icon-chart-screen" style="color: #FF5722;"></i>
                                        <cite>Druid 监控</cite>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/layui/layui.js?v=2.13.6"></script>
<script>
    layui.config({
        base: '/'
        ,version: '2.13.6'
    }).extend({
        index: 'lib/index'
    }).use(['index', 'setter'], function(){ /* 页面初始化钩子 */ });

  // 快捷方式权限过滤：菜单权限接口返回后隐藏无权限项
  (function () {
    var URI = '/api/v1/menuPermission/current';
    function revealAll() {
      document.querySelectorAll('[data-permission]').forEach(function (el) { el.style.display = ''; });
      document.querySelectorAll('.shortcut-group').forEach(function (g) { g.style.display = ''; });
    }
    fetch(URI, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        var data = res && res.code === 0 ? (res.data || {}) : null;
        if (!data || data.allPermitted) { revealAll(); return; }
        var set = new Set(data.permissions || []);
        document.querySelectorAll('[data-permission]').forEach(function (el) {
          el.style.display = set.has(el.getAttribute('data-permission')) ? '' : 'none';
        });
        document.querySelectorAll('.shortcut-group').forEach(function (g) {
          var any = false;
          g.querySelectorAll('li').forEach(function (li) { if (li.style.display !== 'none') any = true; });
          if (!any) g.style.display = 'none';
        });
      })
      .catch(function () { revealAll(); });
  })();
</script>
</body>
</html>
